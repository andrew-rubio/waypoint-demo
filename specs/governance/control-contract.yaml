  controls:
    - controlId: DATA-CONF-001
      severity: blocking
      enforcementStage: build
      policyRef: SYN-POL-DATA
      rationale: Applies because the proposition is classified confidential/restricted
        (dataClassification in [confidential, restricted]).
      matchedBy:
        - dataClassification in [confidential, restricted]
      evidenceRequirements:
        - evidenceId: keyless-infra
          evidenceType: config-check
          descriptor: keyless access + approved storage for confidential data
    - controlId: DATA-FRESH-001
      severity: blocking
      enforcementStage: runtime
      policyRef: SYN-POL-DATA
      rationale: Applies because the proposition uses currency conversion for
        budgeting (externalIntegrations contains "currency").
      matchedBy:
        - externalIntegrations contains "currency"
      evidenceRequirements:
        - evidenceId: currency-freshness-test
          evidenceType: test-result
          descriptor: stale-currency detection + containment test
    - controlId: DATA-MIN-001
      severity: blocking
      enforcementStage: build
      policyRef: SYN-POL-DATA
      rationale: Applies because the proposition handles personal data
        (handlesPersonalData is true).
      matchedBy:
        - handlesPersonalData is true
      evidenceRequirements:
        - evidenceId: data-minimisation
          evidenceType: config-check
          descriptor: personal-data declaration + minimisation
    - controlId: EVAL-GRD-001
      severity: blocking
      enforcementStage: pre-release
      policyRef: SYN-POL-EVAL
      rationale: Applies because the proposition is retrieval-augmented
        (retrievalAugmented is true).
      matchedBy:
        - retrievalAugmented is true
      evidenceRequirements:
        - evidenceId: eval-grounding
          evidenceType: evaluation-result
          descriptor: eval gate thresholds
          threshold: 0.83
    - controlId: EVAL-HITL-001
      severity: blocking
      enforcementStage: pre-release
      policyRef: SYN-POL-EVAL
      rationale: Applies because consequential actions require human approval
        (humanInLoop is true).
      matchedBy:
        - humanInLoop is true
      evidenceRequirements:
        - evidenceId: booking-approval-test
          evidenceType: test-result
          descriptor: human-approval compliance
    - controlId: OPS-TRACE-001
      severity: advisory
      enforcementStage: runtime
      policyRef: SYN-POL-OPS
      rationale: Applies because the proposition emits runtime telemetry (usesLLM is
        true).
      matchedBy:
        - usesLLM is true
      evidenceRequirements:
        - evidenceId: correlation-id
          evidenceType: config-check
          descriptor: correlation id in telemetry
    - controlId: OPS-VER-001
      severity: advisory
      enforcementStage: build
      policyRef: SYN-POL-OPS
      rationale: Applies because operational lineage requires version capture (usesLLM
        is true).
      matchedBy:
        - usesLLM is true
      evidenceRequirements:
        - evidenceId: version-capture
          evidenceType: config-check
          descriptor: runtime metadata version fields
    - controlId: RAI-HITL-001
      severity: blocking
      enforcementStage: runtime
      policyRef: SYN-POL-RAI
      rationale: Applies because the proposition performs financial/consequential
        actions (financialTransactions neq none).
      matchedBy:
        - financialTransactions neq none
      evidenceRequirements:
        - evidenceId: booking-approval-test
          evidenceType: test-result
          descriptor: itinerary-bound booking-approval behavioural test
    - controlId: RAI-OUT-001
      severity: blocking
      enforcementStage: runtime
      policyRef: SYN-POL-RAI
      rationale: Applies because the proposition performs a consequential action
        (consequentialActions contains "simulated-booking").
      matchedBy:
        - consequentialActions contains "simulated-booking"
      evidenceRequirements:
        - evidenceId: booking-approval-test
          evidenceType: test-result
          descriptor: approval-required outcome asserted
    - controlId: REL-CON-001
      severity: blocking
      enforcementStage: release
      policyRef: SYN-POL-REL
      rationale: Applies to every promoted proposition (usesLLM is true).
      matchedBy:
        - usesLLM is true
      evidenceRequirements:
        - evidenceId: approved-contract
          evidenceType: human-approval
          descriptor: approved control contract present
    - controlId: REL-IMM-001
      severity: blocking
      enforcementStage: release
      policyRef: SYN-POL-REL
      rationale: Applies because the proposition deploys to a container runtime
        (deploymentSurface contains "azure-container-apps").
      matchedBy:
        - deploymentSurface contains "azure-container-apps"
      evidenceRequirements:
        - evidenceId: artefact-digest
          evidenceType: artefact-digest
          descriptor: certified immutable artefact digest
    - controlId: SEC-MCP-001
      severity: blocking
      enforcementStage: release
      policyRef: SYN-POL-SEC
      rationale: Applies because the proposition integrates MCP tools
        (externalIntegrations contains "mcp").
      matchedBy:
        - externalIntegrations contains "mcp"
      evidenceRequirements:
        - evidenceId: mcp-allowlist
          evidenceType: mcp-allowlist
          descriptor: configured vs approved tool comparison
    - controlId: SEC-REASON-001
      severity: blocking
      enforcementStage: runtime
      policyRef: SYN-POL-SEC
      rationale: Applies because the proposition uses an LLM (usesLLM is true).
      matchedBy:
        - usesLLM is true
      evidenceRequirements:
        - evidenceId: no-chain-of-thought
          evidenceType: config-check
          descriptor: telemetry emits no private reasoning
    - controlId: SEC-RED-001
      severity: blocking
      enforcementStage: build
      policyRef: SYN-POL-SEC
      rationale: Applies because the proposition streams agent events (usesLLM is true).
      matchedBy:
        - usesLLM is true
      evidenceRequirements:
        - evidenceId: redaction-test
          evidenceType: test-result
          descriptor: redaction executed on a secret fixture
  policyFindings: []
