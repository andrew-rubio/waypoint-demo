# Infrastructure contract — Waypoint
# Phase 1d artifact. Source of truth for Azure resources across all increments.
# infra/main.bicep is generated at INC-1 to match this contract; the
# azure-deployment skill validates parity before shipping.

metadata:
  project: waypoint
  hosting: azure-container-apps
  iac: bicep
  deploy: azd
  authModel: user-assigned-managed-identity + container-app-secrets

# Azure resources provisioned by azd/Bicep
resources:
  - name: containerAppsEnvironment
    type: Microsoft.App/managedEnvironments
    sku: Consumption
    purpose: Host environment for API and Web container apps
    dependsOn: [logAnalytics]
    increment: INC-1

  - name: api
    type: Microsoft.App/containerApps
    purpose: Express backend embedding the GitHub Copilot SDK (bundled Copilot CLI)
    resources: { cpu: 0.5, memory: 1Gi }
    scale: { minReplicas: 1, maxReplicas: 1 }   # 1 warm replica: avoids Copilot runtime cold-start on demos
    ingress: { external: true, targetPort: 8080 }
    identity: userAssignedManagedIdentity
    env:
      - APPLICATIONINSIGHTS_CONNECTION_STRING   # from Application Insights
      - FOUNDRY_MODEL_URL                        # ADR-005 (BYOK → Foundry endpoint)
      - FOUNDRY_MODEL                            # ADR-005 (Foundry deployment name)
      - FOUNDRY_USE_MANAGED_IDENTITY             # ADR-005 (Entra auth; keys disabled by policy)
      - AZURE_CLIENT_ID                          # ADR-005 (selects the user-assigned identity)
      - WAYPOINT_DATA_MCP_URL                    # ADR-009 (self-hosted MCP: cosmos + travel-guide tools)
    secrets:
      # - COPILOT_GITHUB_TOKEN                   # ADR-002 (superseded by ADR-005; kept for the demo)
      - ROUTESTACK_API_KEY                       # INC-5 (public partner identifier)
      - ROUTESTACK_SECRET                        # INC-5 (HMAC signing secret for partner-token)
      # - CURRENCY_API_KEY                       # INC-5/INC-7 dropped: Frankfurter FX is keyless
      # - FABRIC_ENDPOINT / FABRIC_CREDENTIAL    # INC-6 dropped: replaced by Cosmos DB via the waypoint-data MCP (ADR-007)
    increment: INC-1

  - name: web
    type: Microsoft.App/containerApps
    purpose: Next.js frontend (chat UI + audit panel)
    resources: { cpu: 0.25, memory: 0.5Gi }
    scale: { minReplicas: 0, maxReplicas: 1 }   # scale-to-zero
    ingress: { external: true, targetPort: 3000 }
    identity: userAssignedManagedIdentity
    env:
      - API_BASE_URL                             # service discovery to `api`
    increment: INC-1

  - name: foundry
    type: Microsoft.CognitiveServices/accounts   # kind: AIServices + allowProjectManagement (Foundry v2)
    sku: S0
    purpose: BYOK model for the agent (ADR-005). Foundry v2 account + project; OpenAI-compatible endpoint.
    project: waypoint                            # Microsoft.CognitiveServices/accounts/projects (v2 experience)
    deployments:
      - name: gpt-5.4-mini                       # = SDK `model`; version pinned in Bicep
        sku: { name: GlobalStandard, capacity: 20 }   # needs regional quota (Sweden Central)
      - name: text-embedding-3-small             # INC-8 (ADR-008) — embeds the travel-guide PDF into AI Search
        sku: { name: Standard, capacity: 20 }
    auth: managedIdentity                        # Cognitive Services OpenAI User role (keys disabled by policy)
    increment: ADR-005

  - name: cosmos
    type: Microsoft.DocumentDB/databaseAccounts   # capacityMode: Serverless
    purpose: Synthetic traveller profile (loyalty + preferences + past destinations) — ADR-007
    capacityMode: Serverless
    database: waypoint
    container: { name: profiles, partitionKey: /traveller }
    seed: One document (John Doe) upserted by the MCP server on first read
    auth: managedIdentity                         # Cosmos DB Built-in Data Contributor -> userAssignedManagedIdentity (read + one-time seed; keyless)
    network: publicNetworkAccess Enabled + scoped IP firewall (Azure datacenters + portal); org modify-policy exempted for rg (ADR-007)
    increment: INC-6

  - name: waypointDataMcp
    type: Microsoft.App/containerApps
    purpose: Self-hosted MCP server exposing cosmos.getTravellerProfile (INC-6) + travel-guide.searchByMonth (INC-8) — ADR-009
    resources: { cpu: 0.25, memory: 0.5Gi }
    scale: { minReplicas: 0, maxReplicas: 1 }     # scale-to-zero; internal only
    ingress: { external: false, targetPort: 8081 }
    identity: userAssignedManagedIdentity         # reads Cosmos + AI Search keyless
    increment: INC-6

  - name: aiSearch
    type: Microsoft.Search/searchServices
    sku: free                                      # Free tier: 50 MB, 3 indexes, vector search — ADR-008
    purpose: Vector index of the travel-guide PDF (index: travel-guide)
    auth: managedIdentity                         # Search Index Data Reader -> userAssignedManagedIdentity
    increment: INC-8

  - name: containerRegistry
    type: Microsoft.ContainerRegistry/registries
    sku: Basic   # cheapest registry tier
    purpose: Container image storage
    roleAssignments: [AcrPull -> userAssignedManagedIdentity]
    increment: INC-1

  - name: logAnalytics
    type: Microsoft.OperationalInsights/workspaces
    sku: PerGB2018
    retentionInDays: 30        # cost cap
    dailyQuotaGb: 1            # cost cap
    purpose: Central logs for Container Apps + App Insights
    increment: INC-1

  - name: applicationInsights
    type: Microsoft.Insights/components
    samplingPercentage: 20     # reduce ingestion cost
    purpose: Backend telemetry (OpenTelemetry via Aspire) mirroring the audit trail
    dependsOn: [logAnalytics]
    increment: INC-1

  - name: userAssignedManagedIdentity
    type: Microsoft.ManagedIdentity/userAssignedIdentities
    purpose: ACR pull, App Insights ingestion, optional Foundry BYOK
    increment: INC-1

  # Optional hardening — enable if secrets should live in Key Vault vs Container App secrets
  - name: keyVault
    type: Microsoft.KeyVault/vaults
    sku: Standard
    purpose: (optional) secret storage referenced via managed identity
    optional: true
    increment: INC-1+

# External dependencies NOT provisioned by azd (setup prerequisites)
externalDependencies:
  - name: routestack
    kind: mcp-api
    purpose: Flights + hotels (sandbox), simulated booking
    setup: >-
      RouteStack.ai sandbox account (Hiker tier, free). ROUTESTACK_API_KEY +
      ROUTESTACK_SECRET for the HMAC partner-token -> JWT exchange. Reached by
      direct HTTPS from the API (mcp.routestack.ai/mcp/*); payment endpoints are
      never called (booking is simulated locally).
    increment: INC-5
  - name: openMeteo
    kind: mcp-api
    purpose: Weather/geocoding/climate
    setup: Community Open-Meteo MCP; keyless
    increment: INC-4
  - name: currency
    kind: mcp-api
    purpose: GBP normalisation now (INC-5) and GBP<->EUR display later (INC-7)
    setup: Frankfurter (api.frankfurter.dev, ECB daily rates) — keyless, direct HTTPS from the API
    increment: INC-5

# Runtime MCP allowlist enforced by the API
mcpAllowlist: [routestack, open-meteo, currency, cosmos, travel-guide]

# INC-3 contract review: destination-advisor is an in-process skill. It adds no
# Azure resource, secret, environment variable, network dependency, or Bicep change.
