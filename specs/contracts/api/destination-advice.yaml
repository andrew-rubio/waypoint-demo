# API contract — Destination Advice (FRD-003, reworked INC-8)
# This feature extends the existing POST /api/chat SSE stream. It adds no public
# endpoint: destination-advisor is an internal Copilot SDK skill whose invocation
# is observable through the FRD-001 tool_call/tool_result event contract. INC-8
# grounds it in two real MCP calls over the waypoint-data server —
# travel-guide.searchByMonth (Azure AI Search) and cosmos.getTravellerProfile —
# both surfaced as `mcp` audit entries the agent reasons over (ADR-008, ADR-009).
feature: destination-advice
version: "2.0"
extends: chat-and-agent-runtime
basePath: /api

endpoints:
  - path: /chat
    method: POST
    inheritedFrom: chat-and-agent-runtime
    description: >-
      Destination requests use the destination-advisor skill within the existing
      chat turn. On a month-aware turn the API first makes two MCP calls
      (travel-guide.searchByMonth, cosmos.getTravellerProfile), then reasons over
      the guide passages + profile to produce a month-aware, preference-aware,
      guide-grounded shortlist that avoids recently-visited destinations. The
      response remains text/event-stream and includes the two mcp tool_call/
      tool_result pairs followed by the destination-advisor skill result.
    auth: none
    request:
      body:
        type: ChatRequest
    responses:
      200:
        contentType: text/event-stream
        addedEventContract:
          guideCall:
            type: tool_call
            name: travel-guide.searchByMonth
            args: { month: string }
          guideResult:
            type: tool_result
            name: travel-guide.searchByMonth
            ok: boolean
            result: { month: string, passages: integer }
          profileCall:
            type: tool_call
            name: cosmos.getTravellerProfile
          profileResult:
            type: tool_result
            name: cosmos.getTravellerProfile
            ok: boolean
          toolCall:
            type: tool_call
            name: destination-advisor
            args: DestinationAdviceRequest
          toolResult:
            type: tool_result
            name: destination-advisor
            ok: boolean
            result: DestinationAdviceResult
      error:
        description: >-
          A destination-advisor failure emits an error-status skill audit entry
          and a traveller-facing rephrase prompt without terminating the session.
        message: "I couldn't work that out — could you rephrase?"

schemas:
  DestinationAdviceRequest:
    type: object
    required: [interests]
    properties:
      interests:
        type: array
        items: { type: string }
      constraints:
        type: array
        items: { type: string }
      previousSuggestions:
        type: array
        items: { type: DestinationSuggestion }
      month:
        type: string
        optional: true
        description: "INC-8 — target month extracted from the request, e.g. June."
      guidePassages:
        type: array
        optional: true
        description: "INC-8 — travel-guide passages retrieved for the month (grounded candidate pool)."
        items: { type: GuidePassage }
      pastDestinations:
        type: array
        optional: true
        description: "INC-8 — canonical past-destination names to exclude, e.g. Lisbon, Portugal."
        items: { type: string }

  GuidePassage:
    type: object
    required: [name, rationale, tags, month]
    properties:
      name: { type: string, description: Canonical city-or-region and country. }
      rationale: { type: string, description: Month-appropriate reason drawn from the travel guide. }
      tags:
        type: array
        minItems: 1
        items: { type: string }
      month: { type: string }

  DestinationSuggestion:
    type: object
    required: [name, rationale, tags]
    properties:
      name:
        type: string
        description: Canonical city-or-region and country, e.g. Lisbon, Portugal.
      rationale: { type: string }
      tags:
        type: array
        minItems: 1
        items: { type: string }

  DestinationAdviceResult:
    oneOf:
      - kind: shortlist
        required: [suggestions]
        properties:
          suggestions:
            type: array
            minItems: 3
            maxItems: 5
            items: { type: DestinationSuggestion }
          message: { type: string, optional: true }
          guideMatched:
            type: boolean
            optional: true
            description: "INC-8 — true when grounded in guide passages; false on preference fallback."
          month: { type: string, optional: true }
      - kind: clarification
        required: [message]
        properties:
          message: { type: string, description: Exactly one focused question. }
      - kind: no-match
        required: [message, suggestions]
        properties:
          message: { type: string }
          suggestions:
            type: array
            minItems: 1
            maxItems: 5
            items: { type: DestinationSuggestion }
      - kind: redirect
        required: [message]
        properties:
          message: { type: string }

coverage:
  AC-003-1: shortlist result with 3-5 ranked suggestions, rationales and tags
  AC-003-2: clarification result with exactly one question and no suggestions
  AC-003-3: request carries prior context; shortlist reflects new constraints
  AC-003-4: every suggestion name is canonical and downstream-ready
  AC-003-5: month turn makes travel-guide.searchByMonth + cosmos.getTravellerProfile mcp calls; grounded, personalised, avoids past destinations
  FR-003-5: travel-guide.searchByMonth + cosmos.getTravellerProfile mcp entries and destination-advisor skill audit entry
  FR-003-6: shortlist excludes the traveller's recently-visited past destinations
  edge-contradictory: shortlist message acknowledges both interpretations
  edge-niche: no-match result includes closest alternatives
  edge-non-travel: redirect result contains no suggestions
  edge-no-guide-match: guideMatched false; preference-based fallback + "travel guide had no strong match" message
  error-skill: failed skill produces an error audit entry and rephrase message

infrastructure:
  changes: INC-8
  resources:
    - aiSearch (Microsoft.Search/searchServices, Free tier) — travel-guide vector index (ADR-008)
    - foundry embedding deployment text-embedding-3-small — ingests the guide PDF (ADR-008)
    - waypointDataMcp — hosts the travel-guide.searchByMonth tool alongside cosmos.getTravellerProfile (ADR-009)
  reason: >-
    Recommendations are grounded in a travel-guide PDF vectorised into Azure AI
    Search and retrieved via the waypoint-data MCP. Offline, a deterministic
    in-process dataset backs the same tool so tests/demo run without Azure.