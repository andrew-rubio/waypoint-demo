# Foundry Agent Service deployment for Waypoint (INC-9, ADR-010).
#
# SEPARATE azd project from the root azure.yaml (which deploys the ACA `main`
# comparison). This hosts the SAME Copilot SDK harness image as a Foundry hosted
# agent over the `responses` protocol (Path A — Node BYO container).
#
# Container deploy via a PRE-BUILT image: azd rejects a hosted-agent `project:` path
# outside the azd project dir, so instead of building from ../src/api we build the
# src/api/Dockerfile ourselves, push to the project's ACR, and reference it as `image:`.
# (codeConfiguration runtimes are Python/.NET only — Node uses container/image deploy.)

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'

extensions:
  azure.ai.agents: '>=1.0.0-beta.9'

name: waypoint-foundry

services:
  # Model deployment (reuses the ADR-005 choice: gpt-5.4-mini).
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  # The hosted agent — the existing Express + Copilot SDK image.
  waypoint-agent:
    host: azure.ai.agent
    kind: hosted
    name: waypoint-agent
    displayName: Waypoint Holiday-Planning Agent
    description: >-
      A holiday-planning agent built on the GitHub Copilot SDK, hosted on Foundry
      Agent Service over the Responses protocol. Plans a trip, calls weather,
      flight/hotel and travel-guide tools, and streams an observable audit trail.
    # Pre-built image (azd rejects a `project:` outside the azd dir for our monorepo).
    # Built from src/api/Dockerfile and pushed to the project's ACR before deploy.
    image: acrdnszpz4hqfi7g.azurecr.io/waypoint/waypoint-agent:inc9
    protocols:
      - protocol: responses
        version: 2.0.0
    uses:
      - ai-project
    # Bridge to the driver's BYOK model config (ADR-005). FOUNDRY_*/AGENT_* container
    # env names are RESERVED by the hosting platform, so the driver reads WAYPOINT_*
    # aliases here. AZURE_AI_MODEL_DEPLOYMENT_NAME is also injected by the platform.
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      WAYPOINT_MODEL_URL: ${FOUNDRY_MODEL_URL}
      WAYPOINT_USE_MANAGED_IDENTITY: 'true'
      WAYPOINT_WIRE_API: responses
      # Attribute GenAI traces to this agent in App Insights / Foundry (INC-10).
      OTEL_SERVICE_NAME: waypoint-agent
      # Explicit App Insights sink under a non-reserved name (APPLICATIONINSIGHTS_*
      # is platform-reserved). Value from the azd env, not committed.
      WAYPOINT_APPINSIGHTS_CONNECTION_STRING: ${WAYPOINT_APPINSIGHTS_CONNECTION_STRING}
    container:
      resources:
        cpu: '1'
        memory: 2Gi

infra:
  provider: microsoft.foundry
