# Foundry Agent Service deployment for Waypoint (INC-9, ADR-010).
#
# SEPARATE azd project from the root azure.yaml (which deploys the ACA `main`
# comparison). This hosts the SAME Copilot SDK harness image as a Foundry hosted
# agent over the `responses` protocol (Path A — Node BYO container).
#
# Container deploy: the agent service has NO `codeConfiguration:`, so `azd deploy`
# builds the existing src/api Dockerfile and pushes it to the project's ACR.
# The `codeConfiguration` runtimes are Python/.NET only — Node uses container deploy.

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'

extensions:
  azure.ai.agents: '>=1.0.0-beta.9'

name: waypoint-foundry

services:
  # Model deployment (reuses the ADR-005 choice: gpt-5.4-mini).
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  # The hosted agent — the existing Express + Copilot SDK image.
  waypoint-agent:
    host: azure.ai.agent
    kind: hosted
    name: waypoint-agent
    displayName: Waypoint Holiday-Planning Agent
    description: >-
      A holiday-planning agent built on the GitHub Copilot SDK, hosted on Foundry
      Agent Service over the Responses protocol. Plans a trip, calls weather,
      flight/hotel and travel-guide tools, and streams an observable audit trail.
    # Reuse the proven Dockerfile + repo-root build context (mirrors the ACA config).
    project: ../src/api
    docker:
      path: ./Dockerfile
      context: ../..
    protocols:
      - protocol: responses
        version: 2.0.0
    uses:
      - ai-project
    # Bridge the hosted-agent env (FOUNDRY_PROJECT_ENDPOINT +
    # AZURE_AI_MODEL_DEPLOYMENT_NAME are auto-injected) to the driver's BYOK vars
    # (ADR-005). FOUNDRY_MODEL_URL is set per-env before deploy (see .env.example).
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_MODEL: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_MODEL_URL: ${FOUNDRY_MODEL_URL}
      FOUNDRY_USE_MANAGED_IDENTITY: 'true'
      FOUNDRY_WIRE_API: responses
    container:
      resources:
        cpu: '1'
        memory: 2Gi

infra:
  provider: microsoft.foundry
